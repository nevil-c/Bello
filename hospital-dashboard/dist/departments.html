<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bello department inbox</title><style>body{font:14px 'Segoe UI',sans-serif;background:#e5ebf2;color:#243448;margin:0}header{background:#24476b;color:white;padding:18px 28px}main{max-width:1000px;margin:30px auto;padding:0 20px}select,button{padding:10px;border:1px solid #aabed1;border-radius:4px}article{background:white;padding:20px;border:1px solid #bdcbd9;border-radius:5px;margin-top:14px}p{line-height:1.6;white-space:pre-wrap}button{background:#285d8d;color:white;cursor:pointer}.meta{color:#61758b;font-size:12px}a{color:#285d8d}</style></head><body><header>Bello · Shared department inbox</header><main><h1>Patient transcripts</h1><p class="meta">Local demonstration inbox. Any available team member can acknowledge a request.</p><label for="team">Department </label><select id="team"><option>Housekeeping &amp; Facilities</option><option>Food Services</option><option>Unit Clerk / IT Maintenance</option></select> <a href="/">Unit clerk dashboard</a><p id="message" role="status"></p><section id="inbox"></section></main><script>
const api=async(path,options={})=>{const r=await fetch(path,{...options,headers:{'X-Bello-Token':window.BELLO_TOKEN}});const b=await r.json();if(!r.ok)throw Error(b.error);return b};
async function refresh(){try{const team=document.querySelector('#team').value;const body=await api('/api/departments/queue?department='+encodeURIComponent(team));const box=document.querySelector('#inbox');box.replaceChildren();document.querySelector('#message').textContent=body.deliveries.length?'':'No requests for this department.';for(const d of body.deliveries){const card=document.createElement('article'),title=document.createElement('strong'),text=document.createElement('p'),meta=document.createElement('p');title.textContent='Room '+d.room;text.textContent=d.transcript;meta.className='meta';meta.textContent=`Language: ${d.language} · ${d.status} · ${new Date(d.created*1000).toLocaleString()}`;card.append(title,text,meta);if(d.status!=='Acknowledged'){const button=document.createElement('button');button.textContent='Acknowledge';button.onclick=async()=>{button.disabled=true;try{await api(`/api/deliveries/${d.id}/acknowledge`,{method:'POST'});await refresh()}catch(e){document.querySelector('#message').textContent=e.message;button.disabled=false}};card.append(button)}box.append(card)}}catch(e){document.querySelector('#message').textContent=e.message}}
document.querySelector('#team').onchange=refresh;refresh();setInterval(refresh,4000);
</script></body></html>
